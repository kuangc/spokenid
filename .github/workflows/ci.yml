name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest]
        include:
          - python: "3.13"
            os: macos-latest
          - python: "3.13"
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.4"
          enable-cache: true
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run --locked --python ${{ matrix.python }} pytest -q --cov --cov-report=term-missing

  quality:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.4"
          enable-cache: true
      - run: uv sync --locked
      - name: Check the committed full evaluation
        run: uv run --locked python benchmarks/evaluate.py --profile full --check benchmarks/results/v0.1.json
      - name: Check that GitHub Actions are pinned
        run: bash scripts/check_action_refs.sh
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy

  package:
    name: Build and install the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.4"
      - run: uv sync --locked
      - run: uv build --no-build-isolation
      - run: uv run --locked twine check --strict dist/*
      - name: Test the unpacked source distribution
        run: |
          sdist_root=$(mktemp -d)
          tar -xzf dist/spokenid-*.tar.gz -C "$sdist_root"
          cd "$sdist_root"/spokenid-*
          uv run --locked pytest -q
      # Everything above tests the source tree. This tests what people install:
      # a regression that dropped py.typed from the wheel would otherwise ship green.
      - name: Install the wheel and use it from a clean directory
        run: |
          mkdir -p /tmp/clean && cd /tmp/clean
          uv venv
          uv pip install --python .venv "$(ls $GITHUB_WORKSPACE/dist/*.whl)"
          .venv/bin/python -c "
          import importlib.metadata as md, pathlib, spokenid
          scheme = spokenid.Scheme()
          identifier = scheme.random()
          assert scheme.validate(identifier), identifier
          assert md.version('spokenid') == spokenid.__version__, 'version mismatch'
          marker = pathlib.Path(spokenid.__file__).parent / 'py.typed'
          assert marker.is_file(), 'py.typed missing from the wheel'
          print('wheel ok:', identifier, spokenid.__version__)
          "
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/
