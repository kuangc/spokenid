name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  source:
    name: Tag is on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Require the tagged commit to be on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git show-ref --verify --quiet refs/remotes/origin/main || {
            echo "Refusing to release: origin/main was not fetched."; exit 1; }
          tagged_commit=$(git rev-parse "${GITHUB_SHA}^{commit}")
          git merge-base --is-ancestor "$tagged_commit" origin/main || {
            echo "Refusing to release: $tagged_commit is not on origin/main."; exit 1; }

  test:
    name: Python ${{ matrix.python }}
    needs: source
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.4"
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run --locked --python ${{ matrix.python }} pytest -q
      - run: uv run --locked ruff check .
      - run: uv run --locked mypy

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.4"
      - run: uv sync --locked
      - name: Check the committed full evaluation
        run: uv run --locked python benchmarks/evaluate.py --profile full --check benchmarks/results/v0.1.json
      - run: uv build --no-build-isolation
      - run: uv run --locked twine check --strict dist/*
      - name: Test the unpacked source distribution
        run: |
          sdist_root=$(mktemp -d)
          tar -xzf dist/spokenid-*.tar.gz -C "$sdist_root"
          cd "$sdist_root"/spokenid-*
          uv run --locked pytest -q
      - name: Use the wheel from a clean directory before publishing it
        run: |
          mkdir -p /tmp/preflight && cd /tmp/preflight
          uv venv
          uv pip install --python .venv "$(ls "$GITHUB_WORKSPACE"/dist/*.whl)"
          .venv/bin/python -c "
          import spokenid
          scheme = spokenid.Scheme()
          assert scheme.validate(scheme.random())
          print('wheel works:', spokenid.__version__)
          "
      - name: The documentation has to match the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -Eq "^## \[$version\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md || {
            echo "CHANGELOG.md has no dated [$version] section. See RELEASING.md."; exit 1; }
          if grep -q "Not on PyPI yet" README.md; then
            echo "README.md still says the package is not on PyPI, and that text"
            echo "renders on the PyPI page. See RELEASING.md step 3."; exit 1
          fi
          grep -q "pip install spokenid" README.md || {
            echo "README.md does not show 'pip install spokenid'."; exit 1; }
      - name: Check the tag matches the package version
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          built=$(ls dist/*.whl | sed -E 's/.*spokenid-([^-]+)-.*/\1/')
          test "$tagged" = "$built" || {
            echo "tag $tagged does not match package version $built"; exit 1; }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # PyPI Trusted Publishing, so there is no token to leak
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
