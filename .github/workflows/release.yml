name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv sync --python ${{ matrix.python }}
      - run: uv run --python ${{ matrix.python }} pytest -q
      - run: uv run ruff check .
      - run: uv run mypy

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: Use the wheel from a clean directory before publishing it
        run: |
          mkdir -p /tmp/preflight && cd /tmp/preflight
          uv venv
          uv pip install --python .venv "$(ls "$GITHUB_WORKSPACE"/dist/*.whl)"
          .venv/bin/python -c "
          import spokenid
          scheme = spokenid.Scheme()
          assert scheme.validate(scheme.random())
          print('wheel works:', spokenid.__version__)
          "
      - name: The documentation has to match the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "^## \[$version\]" CHANGELOG.md || {
            echo "CHANGELOG.md has no [$version] section. See RELEASING.md."; exit 1; }
          if grep -q "Not on PyPI yet" README.md; then
            echo "README.md still says the package is not on PyPI, and that text"
            echo "renders on the PyPI page. See RELEASING.md step 3."; exit 1
          fi
          grep -q "pip install spokenid" README.md || {
            echo "README.md does not show 'pip install spokenid'."; exit 1; }
      - name: Check the tag matches the package version
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          built=$(ls dist/*.whl | sed -E 's/.*spokenid-([^-]+)-.*/\1/')
          test "$tagged" = "$built" || {
            echo "tag $tagged does not match package version $built"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # PyPI Trusted Publishing, so there is no token to leak
      attestations: write
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          attestations: true
