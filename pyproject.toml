[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "spokenid"
dynamic = ["version"]
description = "Short identifiers designed to be read aloud, written down, and typed back."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Kuang Chen" }]
keywords = [
    "identifier", "id", "id-generation", "human-readable", "check-digit",
    "luhn", "base32", "crockford", "healthcare", "patient-id",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
spokenid = "spokenid.cli:main"

[project.urls]
Homepage = "https://github.com/kuangc/spokenid"
Documentation = "https://github.com/kuangc/spokenid#readme"
Source = "https://github.com/kuangc/spokenid"
Issues = "https://github.com/kuangc/spokenid/issues"
Changelog = "https://github.com/kuangc/spokenid/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "hatchling==1.32.0",
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "mypy>=1.11",
    "pyyaml>=6",
    "ruff>=0.6",
    "twine==7.0.0",
    "types-PyYAML>=6",
]

[tool.uv]
required-version = "==0.12.4"

[tool.hatch.version]
path = "src/spokenid/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/spokenid"]

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "tests",
    "scripts",
    "docs",
    ".github/workflows",
    "benchmarks",
    "README.md",
    "RELEASING.md",
    "SECURITY.md",
    "CONTRIBUTING.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
    "uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
pythonpath = ["."]
addopts = "--doctest-modules --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["spokenid"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
fail_under = 95
show_missing = true

[tool.mypy]
strict = true
files = ["src", "tests", "benchmarks", "scripts"]
python_version = "3.10"

[tool.ruff]
line-length = 90
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",     # pycodestyle, pyflakes
    "I",               # import sorting
    "B",               # bugbear
    "UP",              # pyupgrade
    "SIM",             # simplify
    "RUF",             # ruff-specific
    "D",               # docstrings
    "ANN",             # annotations
    "S",               # bandit: common security problems
    "PT",              # pytest style
    "ARG",             # arguments nothing uses
    "C4",              # comprehensions
    "RET",             # returns
]
ignore = ["D105", "D107", "D203", "D213", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D103", "S101", "SLF001"]

[tool.ruff.lint.pydocstyle]
convention = "google"
